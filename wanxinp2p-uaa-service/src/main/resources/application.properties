
# 应用程序名称
spring.application.name=uaa-service
spring.main.allow-bean-definition-overriding=true

# 微服务访问路径
server.servlet.context-path=/uaa

# 开启swagger
swagger.enable=true

# 日志配置
logging.config=classpath:log4j2-dev.xml

# 中文乱码处理
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# springCloud Alibaba Nacos 注册中心配置
spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848

# springCloud Alibaba Nacos 配置中心
spring.cloud.nacos.config.server-addr=127.0.0.1:8848
#spring.config.import=optional:nacos:consumer-service.yaml?group=DEFAULT_GROUP

# 数据库连接
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/p2p_uaa?useUnicode=true&characterEncoding=utf8&autoReconnect=true&serverTimezone=Asia/Shanghai&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
