spring:
  application:
    name: gateway-server
  config:
    import:
      - optional:nacos:gateway-server.yaml?group=DEFAULT_GROUP
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 18000
      routes:
        - id: consumer-service
          uri: lb://consumer-service
          predicates:
            - Path=/consumer/**
        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/account/**
        - id: uaa-service
          uri: lb://uaa-service
          predicates:
            - Path=/uaa/**
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:53020/oauth2/jwks

logging:
  config: classpath:log4j2-dev.xml
